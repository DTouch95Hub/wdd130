<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Us" />
    <meta name="author" content="Georges Jr Latouche" />

    <link rel="stylesheet" href="styles/rafting.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans&display=swap"
      rel="stylesheet"
    />

    <title>Contact Us | Haiti Rafting Company</title>
  </head>
  <body>
    <header>
      <img src="images/z-downriver.png" alt="rafting company logo" />

      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About us</a></li>
          <li><a href="trips.html">Trips</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contact-info">
        <h1>Contact Information</h1>
        <p>
          <strong>Address:</strong> Coastal Route 1 Labadee, Nord Department
        </p>
        <p><strong>Phone:</strong> (+509) 2223-2425</p>
        <p><strong>Email:</strong> info@haitiraftingcompany.com</p>

        <div class="map-container">
          <iframe
            src="https://www.google.com/maps/embed?pb=YOUR-EMBEDDED-MAP-URL"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          >
          </iframe>
        </div>
      </section>

      <section class="team">
        <h2>Meet Our Team</h2>
        <figure>
          <img src="images/employee1.jpg" alt="Sarah, Reservation Specialist" />
          <figcaption>Sarah – Reservation Specialist</figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Mike, Tour Guide" />
          <figcaption>Mike – Tour Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Tina, Customer Support" />
          <figcaption>Tina – Customer Support</figcaption>
        </figure>
      </section>

      <section class="contact-form">
        <h2>Send Us a Message</h2>
        <form action="#" method="post">
          <label for="name">Full Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required />

          <p>Purpose of Message:</p>
          <label
            ><input type="radio" name="purpose" value="general" required />
            General Inquiry</label
          >
          <label
            ><input type="radio" name="purpose" value="reservation" />
            Reservation Question</label
          >
          <label
            ><input type="radio" name="purpose" value="suggestion" /> Website
            Suggestion</label
          >

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <label>
            <input type="checkbox" name="subscribe" />
            Please subscribe me to the monthly newsletter
          </label>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>

    <footer>
      <p>©2025 | Haiti Rafting Company | Georges Jr Latouche</p>
      <nav class="socialmedia">
        <a href="https://www.facebook.com/">
          <img src="images/facebook.svg" alt="Facebook" />
        </a>
        <a href="https://www.instagram.com/">
          <img src="images/instagram.svg" alt="Instagram" />
        </a>
        <a href="https://x.com/">
          <img src="images/twitter.svg" alt="Twitter" />
        </a>
      </nav>
    </footer>
  </body>
</html>
